# XcodeGen spec — `brew install xcodegen && cd ios && xcodegen generate`, then open Airadar.xcodeproj.
name: Airadar
options:
  bundleIdPrefix: com.airadar
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set in Config.xcconfig

# The one scheme to run: the app (the widget extension rides along inside it).
schemes:
  Airadar:
    build:
      targets:
        Airadar: all
    run:
      config: Debug
    archive:
      config: Release
  # For running/debugging the watch app on its own -- Airadar's own scheme
  # already carries it along as an embedded dependency for a normal build.
  AiradarWatch:
    build:
      targets:
        AiradarWatch: all
    run:
      config: Debug

targets:
  Airadar:
    type: application
    platform: iOS
    sources:
      - path: Airadar
      - path: Shared
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: AiradarWidgets
        embed: true
      - target: AiradarWatch
        embed: true
    info:
      path: Airadar/Info.plist
      properties:
        CFBundleDisplayName: Airadar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCalendarsFullAccessUsageDescription: Airadar reads your calendars to find flights you already have.
        NSLocationWhenInUseUsageDescription: Used to centre the map on your region until you have trips, to show driving/transit time from here to an airport you tap, and — only while you have it turned on with the map's own location button — to show where you are on the My map.
        NSSupportsLiveActivities: true
        # Best-effort Live Activity refresh while backgrounded — see BackgroundRefresh.swift.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.airadar.app.refresh]
        # The Home Screen icon follows the traveller's tier — AppIconManager.swift
        # calls setAlternateIconName whenever FlightStore's tierStanding changes.
        # No paid Developer Program needed for this (unlike Wallet or push).
        # Assets.xcassets, not loose files, since a light/dark appearance variant
        # per icon (the glyph's own transparency over a neutral background that
        # switches with the system, rather than a fixed per-tier colour wash)
        # only asset catalogs support — CFBundleIconFiles still names each
        # appiconset the same way it would a loose file; the catalog resolves
        # @2x/@3x and which appearance to show once compiled.
        UIApplicationSupportsAlternateIcons: true
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon]
            UIPrerenderedIcon: false
          # No CFBundleAlternateIcons block here on purpose: with
          # ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS on, Xcode
          # auto-registers every other App Icon Set in the catalog as an
          # alternate, keyed by its own set name ("AppIcon-gold", etc, via
          # CFBundleIconName) -- hand-declaring the same icons again here
          # under short keys ("gold") created two conflicting registrations
          # for the same underlying icon, which is exactly the kind of
          # ambiguity that makes setAlternateIconName misbehave. Pass
          # "AppIcon-<tier.artKey>" (AppIconManager) to match Xcode's own
          # auto-generated name.
        # OpenSky's TLS setup lacks the forward-secrecy ciphers ATS insists on.
        NSAppTransportSecurity:
          NSExceptionDomains:
            opensky-network.org:
              NSIncludesSubdomains: true
              NSExceptionRequiresForwardSecrecy: false
              NSExceptionMinimumTLSVersion: TLSv1.2
        # googlegmail: "open in Gmail" after importing mail. comgooglemaps/iosamap:
        # so the departure-airport navigation chooser can tell which map apps
        # are actually installed, to offer only those (AirportNavigation.swift).
        LSApplicationQueriesSchemes: [googlegmail, comgooglemaps, iosamap]
        # Sign in with Google: the *iOS* OAuth client id, and its reversed form as a URL scheme.
        GIDClientID: $(GID_CLIENT_ID)
        GIDServerClientID: $(GID_SERVER_CLIENT_ID)
        # Read by Config.swift
        BACKEND_URL: $(BACKEND_URL)
        BACKEND_TOKEN: $(BACKEND_TOKEN)
        OPENSKY_CLIENT_ID: $(OPENSKY_CLIENT_ID)
        OPENSKY_CLIENT_SECRET: $(OPENSKY_CLIENT_SECRET)
        LINK_HOST: $(LINK_HOST)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [airadar, $(GID_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airadar.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this, actool only compiles the icon set named above (the
        # primary) into Assets.car -- every AppIcon-<tier> alternate gets
        # silently stripped as "unused", so setAlternateIconName succeeds
        # (the OS even shows its own "You have changed the icon" alert) but
        # there's no actual image left for SpringBoard to draw. Confirmed
        # live: only Default (which just reverts to the primary icon) ever
        # visibly changed; every tier icon did not.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        # Fill these in Config.xcconfig (not committed) — see Config.example.xcconfig
        BACKEND_URL: $(BACKEND_URL)
        BACKEND_TOKEN: $(BACKEND_TOKEN)
        OPENSKY_CLIENT_ID: $(OPENSKY_CLIENT_ID)
        OPENSKY_CLIENT_SECRET: $(OPENSKY_CLIENT_SECRET)
        LINK_HOST: $(LINK_HOST)
        # No entitlements by default, so a free personal team can sign it. A paid team adds
        # universal links with CODE_SIGN_ENTITLEMENTS = Entitlements/Airadar.entitlements in Config.xcconfig.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  # Live Activity / Dynamic Island. Shares the attributes file with the app.
  AiradarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AiradarWidgets
      - path: Shared
    info:
      path: AiradarWidgets/Info.plist
      properties:
        CFBundleDisplayName: Airadar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airadar.app.widgets
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  # The watch companion: mirrors whatever FlightStore last sent it over
  # WatchConnectivity (WatchSync.swift, phone side) -- no sign-in, no
  # networking of its own in this first pass, just a fast, glanceable
  # showing of what the phone already knows. Independent-runtime is on
  # so it keeps showing that last snapshot (and its complications keep
  # ticking) even when the phone is out of range.
  AiradarWatch:
    type: application
    platform: watchOS
    sources:
      - path: AiradarWatch
      # Everything but FlightActivityAttributes.swift -- ActivityKit itself
      # (Live Activities, iOS/iPadOS/macOS only) isn't available on watchOS.
      - path: Shared
        excludes:
          - FlightActivityAttributes.swift
    dependencies:
      - target: AiradarWatchWidget
        embed: true
    info:
      path: AiradarWatch/Info.plist
      properties:
        CFBundleDisplayName: Airadar
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.airadar.app
        # Explicit, matching TARGETED_DEVICE_FAMILY below -- Apple's own
        # watchOS templates always declare this. Only actually matters for
        # a CLI build with no watch simulator paired/booted: xcodebuild then
        # resolves the embedded watch target's Info.plist against the host
        # iOS destination's family (1,2) instead of the watch's own (4),
        # which fails `simctl install` with "does not specify family 4".
        # A normal Xcode Run (or one with the watch paired) doesn't hit this.
        UIDeviceFamily: [4]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Read by Config.swift, for the day this does call the backend directly.
        BACKEND_URL: $(BACKEND_URL)
        BACKEND_TOKEN: $(BACKEND_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airadar.app.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: false
        BACKEND_URL: $(BACKEND_URL)
        BACKEND_TOKEN: $(BACKEND_TOKEN)
        CODE_SIGN_ENTITLEMENTS: AiradarWatch/AiradarWatch.entitlements
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    entitlements:
      path: AiradarWatch/AiradarWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.airadar.app]

  # Complications -- accessoryCircular (the countdown ring) and
  # accessoryRectangular (route + time) for the watch face. Reads the same
  # WatchSnapshot the app itself shows, from the App Group container
  # (WatchSync.swift on the phone writes it there too, not just over the
  # live WCSession message, so a complication refreshing on its own budget
  # -- the app process need not even be running -- still has something to draw).
  AiradarWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: AiradarWatchWidget
      - path: Shared
        excludes:
          - FlightActivityAttributes.swift
    info:
      path: AiradarWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Airadar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airadar.app.watchkitapp.widget
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: AiradarWatchWidget/AiradarWatchWidget.entitlements
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    entitlements:
      path: AiradarWatchWidget/AiradarWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.airadar.app]
