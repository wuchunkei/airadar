# XcodeGen spec — `brew install xcodegen && cd ios && xcodegen generate`, then open Airadar.xcodeproj.
name: Airadar
options:
  bundleIdPrefix: com.airadar
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set in Config.xcconfig

# The one scheme to run: the app (the widget extension rides along inside it).
schemes:
  Airadar:
    build:
      targets:
        Airadar: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Airadar:
    type: application
    platform: iOS
    sources:
      - path: Airadar
      - path: Shared
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: AiradarWidgets
        embed: true
    info:
      path: Airadar/Info.plist
      properties:
        CFBundleDisplayName: Airadar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCalendarsFullAccessUsageDescription: Airadar reads your calendars to find flights you already have.
        NSLocationWhenInUseUsageDescription: Used to centre the map on your region until you have trips, to show driving/transit time from here to an airport you tap, and — only while you have it turned on with the map's own location button — to show where you are on the My map.
        NSSupportsLiveActivities: true
        # Best-effort Live Activity refresh while backgrounded — see BackgroundRefresh.swift.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.airadar.app.refresh]
        # The Home Screen icon follows the traveller's tier — AppIconManager.swift
        # calls setAlternateIconName whenever FlightStore's tierStanding changes.
        # No paid Developer Program needed for this (unlike Wallet or push).
        # Assets.xcassets, not loose files, since a light/dark appearance variant
        # per icon (the glyph's own transparency over a neutral background that
        # switches with the system, rather than a fixed per-tier colour wash)
        # only asset catalogs support — CFBundleIconFiles still names each
        # appiconset the same way it would a loose file; the catalog resolves
        # @2x/@3x and which appearance to show once compiled.
        UIApplicationSupportsAlternateIcons: true
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon]
            UIPrerenderedIcon: false
          # No CFBundleAlternateIcons block here on purpose: with
          # ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS on, Xcode
          # auto-registers every other App Icon Set in the catalog as an
          # alternate, keyed by its own set name ("AppIcon-gold", etc, via
          # CFBundleIconName) -- hand-declaring the same icons again here
          # under short keys ("gold") created two conflicting registrations
          # for the same underlying icon, which is exactly the kind of
          # ambiguity that makes setAlternateIconName misbehave. Pass
          # "AppIcon-<tier.artKey>" (AppIconManager) to match Xcode's own
          # auto-generated name.
        # OpenSky's TLS setup lacks the forward-secrecy ciphers ATS insists on.
        NSAppTransportSecurity:
          NSExceptionDomains:
            opensky-network.org:
              NSIncludesSubdomains: true
              NSExceptionRequiresForwardSecrecy: false
              NSExceptionMinimumTLSVersion: TLSv1.2
        # googlegmail: "open in Gmail" after importing mail. comgooglemaps/iosamap:
        # so the departure-airport navigation chooser can tell which map apps
        # are actually installed, to offer only those (AirportNavigation.swift).
        LSApplicationQueriesSchemes: [googlegmail, comgooglemaps, iosamap]
        # Sign in with Google: the *iOS* OAuth client id, and its reversed form as a URL scheme.
        GIDClientID: $(GID_CLIENT_ID)
        GIDServerClientID: $(GID_SERVER_CLIENT_ID)
        # Read by Config.swift
        BACKEND_URL: $(BACKEND_URL)
        BACKEND_TOKEN: $(BACKEND_TOKEN)
        OPENSKY_CLIENT_ID: $(OPENSKY_CLIENT_ID)
        OPENSKY_CLIENT_SECRET: $(OPENSKY_CLIENT_SECRET)
        LINK_HOST: $(LINK_HOST)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [airadar, $(GID_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airadar.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this, actool only compiles the icon set named above (the
        # primary) into Assets.car -- every AppIcon-<tier> alternate gets
        # silently stripped as "unused", so setAlternateIconName succeeds
        # (the OS even shows its own "You have changed the icon" alert) but
        # there's no actual image left for SpringBoard to draw. Confirmed
        # live: only Default (which just reverts to the primary icon) ever
        # visibly changed; every tier icon did not.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        # Fill these in Config.xcconfig (not committed) — see Config.example.xcconfig
        BACKEND_URL: $(BACKEND_URL)
        BACKEND_TOKEN: $(BACKEND_TOKEN)
        OPENSKY_CLIENT_ID: $(OPENSKY_CLIENT_ID)
        OPENSKY_CLIENT_SECRET: $(OPENSKY_CLIENT_SECRET)
        LINK_HOST: $(LINK_HOST)
        # No entitlements by default, so a free personal team can sign it. A paid team adds
        # universal links with CODE_SIGN_ENTITLEMENTS = Entitlements/Airadar.entitlements in Config.xcconfig.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  # Live Activity / Dynamic Island. Shares the attributes file with the app.
  AiradarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AiradarWidgets
      - path: Shared
    info:
      path: AiradarWidgets/Info.plist
      properties:
        CFBundleDisplayName: Airadar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airadar.app.widgets
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
