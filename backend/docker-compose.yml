services:
  airadar:
    build: .
    container_name: airadar-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    # The website's Android download: scripts/publish-apk.sh stages it here.
    volumes:
      - ./downloads:/srv/downloads:ro
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 60s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    container_name: airadar-mongo
    restart: unless-stopped
    # Not published: only the backend container can reach it.
    volumes:
      - mongo-data:/data/db

  # HTTPS in front of the API. Needs DOMAIN in .env and that domain's A record
  # pointing here; Caddy fetches and renews the Let's Encrypt certificate itself.
  # Start it with: docker compose --profile https up -d
  caddy:
    image: caddy:2
    container_name: airadar-caddy
    restart: unless-stopped
    profiles: ["https"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to airadar:8080
    volumes:
      - caddy-data:/data
    depends_on:
      - airadar

volumes:
  mongo-data:
  caddy-data:
