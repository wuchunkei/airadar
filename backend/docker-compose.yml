services:
  airadar:
    build: .
    container_name: airadar-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
